name: Controller CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server-requirements.txt httpx
      - run: python -m unittest discover -s tests -v
        env:
          PBS_CONTROLLER_TOKEN: test-token-must-be-at-least-thirty-two-characters-long
          PBS_CONTROLLER_DB: /tmp/pbs-controller-ci.sqlite3
      - run: python -m compileall -q controller desktop

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name PBS-Controller --collect-all webview desktop/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PBS-Controller-Windows
          path: dist/PBS-Controller.exe
